name: Gerar instalador
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Encontrar o programa (de preferencia o .zip enviado)
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Recurse -Depth 2 -Filter "Projecao*.zip" | Sort-Object Name -Descending | Select-Object -First 1
          if ($zip) {
            Write-Host "Usando o arquivo $($zip.Name)"
            Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\programa" -Force
            $base = "$env:RUNNER_TEMP\programa"
          } else { $base = "." }
          $pasta = (Get-ChildItem -Path $base -Recurse -Filter package.json -Depth 3 | Where-Object { $_.FullName -notmatch 'node_modules' } | Select-Object -First 1).DirectoryName
          if (-not $pasta) { throw "Nao encontrei o programa. Envie o arquivo ProjecaoAssembleia-vX.zip para o repositorio." }
          $faltando = @('main.js','preload.js','lib\texto.js','lib\biblia.js','lib\igreja.js','lib\nuvem.js','lib\letrasOnline.js','src\index.html','src\renderer.js','src\erros.js','src\projetor.html','src\movel.html','src\fundo.js') | Where-Object { -not (Test-Path (Join-Path $pasta $_)) }
          if ($faltando) { throw ("Faltam arquivos do programa: " + ($faltando -join ', ') + ". Envie o arquivo .zip do programa inteiro para o repositorio.") }
          Write-Host "Programa completo em $pasta"
          "PASTA=$pasta" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Conferir o icone
        shell: pwsh
        run: |
          pip install pillow --quiet
          python -c @"
          import os, json
          from PIL import Image
          p = os.environ['PASTA']; a = os.path.join(p, 'assets'); os.makedirs(a, exist_ok=True)
          ico = os.path.join(a, 'icone.ico')
          if not os.path.exists(ico):
              for n in ['icone.png', 'logo.png', 'icone-512.png', 'icone-192.png']:
                  f = os.path.join(a, n)
                  if os.path.exists(f):
                      Image.open(f).convert('RGBA').save(ico, sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
                      print('Icone criado a partir de', n); break
          if not os.path.exists(ico):
              print('Sem imagem de icone: o instalador vai usar o icone padrao')
              pj = os.path.join(p, 'package.json'); d = json.load(open(pj, encoding='utf-8'))
              d['build'].get('win', {}).pop('icon', None)
              for k in ['installerIcon', 'uninstallerIcon']: d['build'].get('nsis', {}).pop(k, None)
              json.dump(d, open(pj, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('Arquivos em assets:', os.listdir(a))
          "@
      - name: Montar o instalador
        shell: pwsh
        run: |
          Set-Location $env:PASTA
          npm install --no-audit --no-fund
          npx electron-builder --win --x64 --publish never
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/saida" | Out-Null
          Copy-Item dist/*.exe "$env:GITHUB_WORKSPACE/saida/"
      - uses: actions/upload-artifact@v4
        with:
          name: Instalador-Projecao-Assembleia
          path: saida/*.exe
