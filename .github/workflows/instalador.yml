name: Gerar instalador
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Encontrar o programa (de preferencia o .zip enviado)
        shell: pwsh
        run: |
          # usa o .zip enviado POR ÚLTIMO (data do envio no GitHub), não o de nome "maior"
          $zips = @(Get-ChildItem -Path . -Recurse -Depth 2 -Filter "Projecao*.zip")
          foreach ($z in $zips) { $z | Add-Member -NotePropertyName Envio -NotePropertyValue ([long](git log -1 --format=%ct -- "$($z.FullName)")) }
          $zips | Sort-Object Envio -Descending | ForEach-Object { Write-Host ("  encontrado: {0}  (enviado em {1})" -f $_.Name, [DateTimeOffset]::FromUnixTimeSeconds($_.Envio).ToLocalTime()) }
          # empate (enviados juntos): fica o de nome maior, ex.: v1.6_4 antes de v1.6
          $zip = $zips | Sort-Object @{Expression='Envio';Descending=$true}, @{Expression='Name';Descending=$true} | Select-Object -First 1
          if ($zips.Count -gt 1) { Write-Host "::warning::Ha $($zips.Count) arquivos .zip do programa no repositorio. Usei o enviado por ultimo: $($zip.Name). Pode apagar os antigos." }
          if ($zip) {
            Write-Host "Usando o arquivo $($zip.Name)"
            "ZIP_USADO=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\programa" -Force
            $base = "$env:RUNNER_TEMP\programa"
          } else { $base = "." }
          $pasta = (Get-ChildItem -Path $base -Recurse -Filter package.json -Depth 3 | Where-Object { $_.FullName -notmatch 'node_modules' } | Select-Object -First 1).DirectoryName
          if (-not $pasta) { throw "Nao encontrei o programa. Envie o arquivo ProjecaoAssembleia-vX.zip para o repositorio." }
          $faltando = @('main.js','preload.js','lib\texto.js','lib\biblia.js','lib\igreja.js','lib\nuvem.js','lib\letrasOnline.js','lib\atualizador.js','src\index.html','src\renderer.js','src\erros.js','src\projetor.html','src\movel.html','src\fundo.js') | Where-Object { -not (Test-Path (Join-Path $pasta $_)) }
          if ($faltando) { throw ("Faltam arquivos do programa: " + ($faltando -join ', ') + ". Envie o arquivo .zip do programa inteiro para o repositorio.") }
          Write-Host "Programa completo em $pasta"
          "PASTA=$pasta" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Conferir o icone
        shell: pwsh
        run: |
          pip install pillow --quiet
          python -c @"
          import os, json
          from PIL import Image
          p = os.environ['PASTA']; a = os.path.join(p, 'assets'); os.makedirs(a, exist_ok=True)
          ico = os.path.join(a, 'icone.ico')
          if not os.path.exists(ico):
              for n in ['icone.png', 'logo.png', 'icone-512.png', 'icone-192.png']:
                  f = os.path.join(a, n)
                  if os.path.exists(f):
                      Image.open(f).convert('RGBA').save(ico, sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
                      print('Icone criado a partir de', n); break
          if not os.path.exists(ico):
              print('Sem imagem de icone: o instalador vai usar o icone padrao')
              pj = os.path.join(p, 'package.json'); d = json.load(open(pj, encoding='utf-8'))
              d['build'].get('win', {}).pop('icon', None)
              for k in ['installerIcon', 'uninstallerIcon']: d['build'].get('nsis', {}).pop(k, None)
              json.dump(d, open(pj, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('Arquivos em assets:', os.listdir(a))
          "@
      - name: Numerar a versao
        shell: pwsh
        run: |
          if (Test-Path "$env:PASTA\ferramentas\preparar-versao.js") { node "$env:PASTA\ferramentas\preparar-versao.js" "$env:PASTA" }
          else { "VERSAO=sem-numero" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          if ("${{ github.event.repository.private }}" -eq "true") {
            Write-Host "::warning::O repositorio esta PRIVADO: o programa nao consegue se atualizar sozinho. Em Settings > General > Danger Zone, clique em 'Change visibility' e deixe Public."
          }
      - name: Montar o instalador
        shell: pwsh
        run: |
          Set-Location $env:PASTA
          npm install --no-audit --no-fund
          npx electron-builder --win --x64 --publish never
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/saida" | Out-Null
          Copy-Item dist/*.exe "$env:GITHUB_WORKSPACE/saida/"
      - uses: actions/upload-artifact@v4
        with:
          name: Instalador-Projecao-Assembleia
          path: saida/*.exe
      - name: Publicar a versao (o programa instalado se atualiza sozinho)
        if: env.VERSAO != 'sem-numero'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSAO }}
          name: Projeção Assembleia ${{ env.VERSAO }}
          body: Nova versão do Projeção Assembleia. Os computadores com o programa instalado recebem esta versão sozinhos (botão "Atualizar" no topo).
          files: saida/*.exe
          make_latest: true
      - name: Limpar os .zip antigos do repositorio (fica so o usado)
        if: success() && env.ZIP_USADO != ''
        shell: pwsh
        run: |
          $outros = @(Get-ChildItem -Path . -Recurse -Depth 2 -Filter "Projecao*.zip" | Where-Object { $_.FullName -ne $env:ZIP_USADO })
          if (-not $outros.Count) { Write-Host "Nada para limpar."; exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          foreach ($z in $outros) { Write-Host "Apagando $($z.Name)"; git rm -q -- "$($z.FullName)" }
          git commit -m "Limpeza automatica: apaga .zip antigos do programa [skip ci]"
          git pull --rebase -q
          git push
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Nao consegui apagar os .zip antigos (o instalador foi gerado normalmente)." ; exit 0 }
